<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Lorenz Attractor Surface with Moving Marker</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f3f2ee;
      color: #334155;
    }

    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      width: 340px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(120, 130, 145, 0.18);
      border-radius: 14px;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 18px;
      margin: 0 0 8px 0;
      color: #3f5665;
    }

    p {
      font-size: 13px;
      color: #667b88;
      line-height: 1.45;
      margin: 0 0 12px 0;
    }

    label {
      display: block;
      font-size: 13px;
      margin-top: 10px;
      color: #4b5f6c;
    }

    input {
      width: 100%;
      margin-top: 4px;
    }

    .value {
      float: right;
      color: #5b7a8f;
      font-weight: bold;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      border: none;
      border-radius: 9px;
      background: #738a97;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #627885;
    }

    #equations {
      margin-top: 13px;
      padding: 10px;
      border-radius: 10px;
      background: rgba(130, 145, 155, 0.08);
      color: #556b78;
      font-size: 12px;
      line-height: 1.5;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
      }
    }
  </script>
</head>

<body>
  <div id="ui">
    <h1>Lorenz Attractor → Surface → STL</h1>
    <p>
      Clean unlit Lorenz attractor with a clearly visible moving marker.
      STL export saves the attractor tube geometry.
    </p>

    <label>
      σ — sigma
      <span class="value" id="sigmaValue">10.0</span>
      <input id="sigmaSlider" type="range" min="1" max="30" step="0.1" value="10">
    </label>

    <label>
      ρ — rho
      <span class="value" id="rhoValue">28.0</span>
      <input id="rhoSlider" type="range" min="1" max="60" step="0.1" value="28">
    </label>

    <label>
      β — beta
      <span class="value" id="betaValue">2.67</span>
      <input id="betaSlider" type="range" min="0.5" max="10" step="0.01" value="2.6667">
    </label>

    <label>
      Time step dt
      <span class="value" id="dtValue">0.006</span>
      <input id="dtSlider" type="range" min="0.001" max="0.02" step="0.001" value="0.006">
    </label>

    <label>
      Integration steps
      <span class="value" id="stepsValue">6000</span>
      <input id="stepsSlider" type="range" min="1000" max="16000" step="500" value="6000">
    </label>

    <label>
      Tube radius
      <span class="value" id="radiusValue">0.040</span>
      <input id="radiusSlider" type="range" min="0.005" max="0.15" step="0.005" value="0.040">
    </label>

    <label>
      Tube smoothness
      <span class="value" id="radialValue">14</span>
      <input id="radialSlider" type="range" min="6" max="32" step="1" value="14">
    </label>

    <label>
      Marker speed
      <span class="value" id="markerSpeedValue">0.85</span>
      <input id="markerSpeedSlider" type="range" min="0" max="4" step="0.05" value="0.85">
    </label>

    <label>
      Marker size
      <span class="value" id="markerSizeValue">0.110</span>
      <input id="markerSizeSlider" type="range" min="0.03" max="0.30" step="0.005" value="0.110">
    </label>

    <label>
      Rotate scene
      <span class="value" id="rotateValue">Yes</span>
      <input id="rotateCheckbox" type="checkbox" checked>
    </label>

    <button id="exportBtn">Export STL</button>

    <div id="equations">
      dx/dt = σ(y − x)<br>
      dy/dt = x(ρ − z) − y<br>
      dz/dt = xy − βz
    </div>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { STLExporter } from "three/addons/exporters/STLExporter.js";

    let scene, camera, renderer, controls;

    let attractorGroup = null;
    let attractorMesh = null;
    let markerGroup = null;
    let markerOuter = null;
    let markerInner = null;

    let trajectoryPoints = [];
    let markerIndexFloat = 0;
    let markerDirection = 1;

    const clock = new THREE.Clock();

    const ui = {
      sigma: document.getElementById("sigmaSlider"),
      rho: document.getElementById("rhoSlider"),
      beta: document.getElementById("betaSlider"),
      dt: document.getElementById("dtSlider"),
      steps: document.getElementById("stepsSlider"),
      radius: document.getElementById("radiusSlider"),
      radial: document.getElementById("radialSlider"),
      markerSpeed: document.getElementById("markerSpeedSlider"),
      markerSize: document.getElementById("markerSizeSlider"),
      rotateCheckbox: document.getElementById("rotateCheckbox"),

      sigmaValue: document.getElementById("sigmaValue"),
      rhoValue: document.getElementById("rhoValue"),
      betaValue: document.getElementById("betaValue"),
      dtValue: document.getElementById("dtValue"),
      stepsValue: document.getElementById("stepsValue"),
      radiusValue: document.getElementById("radiusValue"),
      radialValue: document.getElementById("radialValue"),
      markerSpeedValue: document.getElementById("markerSpeedValue"),
      markerSizeValue: document.getElementById("markerSizeValue"),
      rotateValue: document.getElementById("rotateValue"),

      exportBtn: document.getElementById("exportBtn")
    };

    init();
    createLorenzAttractor();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xf3f2ee);

      attractorGroup = new THREE.Group();
      scene.add(attractorGroup);

      camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.01,
        1000
      );
      camera.position.set(5.5, 4.2, 7.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.enablePan = false;

      window.addEventListener("resize", onWindowResize);

      const rebuildSliders = [
        ui.sigma, ui.rho, ui.beta, ui.dt, ui.steps, ui.radius, ui.radial
      ];

      for (const slider of rebuildSliders) {
        slider.addEventListener("input", createLorenzAttractor);
      }

      ui.markerSpeed.addEventListener("input", updateUIValues);

      ui.markerSize.addEventListener("input", () => {
        updateUIValues();
        updateMarkerSize();
      });

      ui.rotateCheckbox.addEventListener("change", updateUIValues);

      ui.exportBtn.addEventListener("click", exportSTL);
    }

    function lorenzDerivative(p, sigma, rho, beta) {
      return {
        x: sigma * (p.y - p.x),
        y: p.x * (rho - p.z) - p.y,
        z: p.x * p.y - beta * p.z
      };
    }

    function rk4Step(p, dt, sigma, rho, beta) {
      const k1 = lorenzDerivative(p, sigma, rho, beta);

      const p2 = {
        x: p.x + 0.5 * dt * k1.x,
        y: p.y + 0.5 * dt * k1.y,
        z: p.z + 0.5 * dt * k1.z
      };
      const k2 = lorenzDerivative(p2, sigma, rho, beta);

      const p3 = {
        x: p.x + 0.5 * dt * k2.x,
        y: p.y + 0.5 * dt * k2.y,
        z: p.z + 0.5 * dt * k2.z
      };
      const k3 = lorenzDerivative(p3, sigma, rho, beta);

      const p4 = {
        x: p.x + dt * k3.x,
        y: p.y + dt * k3.y,
        z: p.z + dt * k3.z
      };
      const k4 = lorenzDerivative(p4, sigma, rho, beta);

      return {
        x: p.x + (dt / 6) * (k1.x + 2 * k2.x + 2 * k3.x + k4.x),
        y: p.y + (dt / 6) * (k1.y + 2 * k2.y + 2 * k3.y + k4.y),
        z: p.z + (dt / 6) * (k1.z + 2 * k2.z + 2 * k3.z + k4.z)
      };
    }

    function generateLorenzPoints() {
      const sigma = Number(ui.sigma.value);
      const rho = Number(ui.rho.value);
      const beta = Number(ui.beta.value);
      const dt = Number(ui.dt.value);
      const steps = Number(ui.steps.value);

      const burnIn = 300;
      let p = { x: 0.1, y: 0, z: 0 };
      const rawPoints = [];

      for (let i = 0; i < steps + burnIn; i++) {
        p = rk4Step(p, dt, sigma, rho, beta);

        if (i >= burnIn) {
          rawPoints.push(new THREE.Vector3(p.x, p.y, p.z));
        }
      }

      return normalizePoints(rawPoints);
    }

    function normalizePoints(points) {
      const box = new THREE.Box3().setFromPoints(points);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();

      box.getCenter(center);
      box.getSize(size);

      const maxDimension = Math.max(size.x, size.y, size.z);
      const targetSize = 5.0;
      const scale = targetSize / maxDimension;

      return points.map(p => {
        return new THREE.Vector3(
          (p.x - center.x) * scale,
          (p.y - center.y) * scale,
          (p.z - center.z) * scale
        );
      });
    }

    function createTubeGeometryWithCaps(points, radius, radialSegments) {
      const vertices = [];
      const indices = [];

      const tangents = [];
      const normals = [];
      const binormals = [];

      for (let i = 0; i < points.length; i++) {
        let tangent;

        if (i === 0) {
          tangent = new THREE.Vector3().subVectors(points[1], points[0]);
        } else if (i === points.length - 1) {
          tangent = new THREE.Vector3().subVectors(points[i], points[i - 1]);
        } else {
          tangent = new THREE.Vector3().subVectors(points[i + 1], points[i - 1]);
        }

        tangent.normalize();
        tangents.push(tangent);
      }

      let initialNormal = new THREE.Vector3(0, 1, 0);
      if (Math.abs(initialNormal.dot(tangents[0])) > 0.9) {
        initialNormal = new THREE.Vector3(1, 0, 0);
      }

      let binormal = new THREE.Vector3().crossVectors(tangents[0], initialNormal).normalize();
      let normal = new THREE.Vector3().crossVectors(binormal, tangents[0]).normalize();

      normals.push(normal.clone());
      binormals.push(binormal.clone());

      for (let i = 1; i < points.length; i++) {
        const previousTangent = tangents[i - 1];
        const currentTangent = tangents[i];

        const axis = new THREE.Vector3().crossVectors(previousTangent, currentTangent);
        const axisLength = axis.length();

        if (axisLength > 1e-6) {
          axis.normalize();

          const angle = Math.acos(
            THREE.MathUtils.clamp(previousTangent.dot(currentTangent), -1, 1)
          );

          const quaternion = new THREE.Quaternion().setFromAxisAngle(axis, angle);
          normal.applyQuaternion(quaternion);
        }

        binormal = new THREE.Vector3().crossVectors(currentTangent, normal).normalize();
        normal = new THREE.Vector3().crossVectors(binormal, currentTangent).normalize();

        normals.push(normal.clone());
        binormals.push(binormal.clone());
      }

      for (let i = 0; i < points.length; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const angle = (j / radialSegments) * Math.PI * 2;

          const radialDirection = new THREE.Vector3()
            .addScaledVector(normals[i], Math.cos(angle))
            .addScaledVector(binormals[i], Math.sin(angle))
            .normalize();

          const vertex = new THREE.Vector3()
            .copy(points[i])
            .addScaledVector(radialDirection, radius);

          vertices.push(vertex.x, vertex.y, vertex.z);
        }
      }

      for (let i = 0; i < points.length - 1; i++) {
        for (let j = 0; j < radialSegments; j++) {
          const a = i * radialSegments + j;
          const b = i * radialSegments + ((j + 1) % radialSegments);
          const c = (i + 1) * radialSegments + j;
          const d = (i + 1) * radialSegments + ((j + 1) % radialSegments);

          indices.push(a, c, b);
          indices.push(b, c, d);
        }
      }

      const startCenterIndex = vertices.length / 3;
      vertices.push(points[0].x, points[0].y, points[0].z);

      for (let j = 0; j < radialSegments; j++) {
        const a = j;
        const b = (j + 1) % radialSegments;
        indices.push(startCenterIndex, b, a);
      }

      const endCenterIndex = vertices.length / 3;
      const lastRingStart = (points.length - 1) * radialSegments;
      const lastPoint = points[points.length - 1];
      vertices.push(lastPoint.x, lastPoint.y, lastPoint.z);

      for (let j = 0; j < radialSegments; j++) {
        const a = lastRingStart + j;
        const b = lastRingStart + ((j + 1) % radialSegments);
        indices.push(endCenterIndex, a, b);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices, 3)
      );
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      return geometry;
    }

    function createLorenzAttractor() {
      updateUIValues();

      if (attractorMesh) {
        attractorGroup.remove(attractorMesh);
        attractorMesh.geometry.dispose();
        attractorMesh.material.dispose();
        attractorMesh = null;
      }

      if (markerGroup) {
        attractorGroup.remove(markerGroup);

        if (markerOuter) {
          markerOuter.geometry.dispose();
          markerOuter.material.dispose();
        }

        if (markerInner) {
          markerInner.geometry.dispose();
          markerInner.material.dispose();
        }

        markerGroup = null;
        markerOuter = null;
        markerInner = null;
      }

      const points = generateLorenzPoints();
      trajectoryPoints = points;
      markerIndexFloat = 0;
      markerDirection = 1;

      const radius = Number(ui.radius.value);
      const radialSegments = Number(ui.radial.value);

      const geometry = createTubeGeometryWithCaps(points, radius, radialSegments);

      const material = new THREE.MeshBasicMaterial({
        color: 0x6f8794
      });

      attractorMesh = new THREE.Mesh(geometry, material);
      attractorGroup.add(attractorMesh);

      createMovingMarker();
      updateMarkerPosition(0);
    }

    function createMovingMarker() {
      markerGroup = new THREE.Group();

      const markerRadius = Number(ui.markerSize.value);

      const outerGeometry = new THREE.SphereGeometry(markerRadius * 1.35, 32, 16);
      const outerMaterial = new THREE.MeshBasicMaterial({
        color: 0x24313a
      });

      markerOuter = new THREE.Mesh(outerGeometry, outerMaterial);

      const innerGeometry = new THREE.SphereGeometry(markerRadius, 32, 16);
      const innerMaterial = new THREE.MeshBasicMaterial({
        color: 0xff8c42
      });

      markerInner = new THREE.Mesh(innerGeometry, innerMaterial);

      markerGroup.add(markerOuter);
      markerGroup.add(markerInner);

      attractorGroup.add(markerGroup);
    }

    function updateMarkerSize() {
      if (!markerOuter || !markerInner) return;

      const markerRadius = Number(ui.markerSize.value);

      markerOuter.geometry.dispose();
      markerOuter.geometry = new THREE.SphereGeometry(markerRadius * 1.35, 32, 16);

      markerInner.geometry.dispose();
      markerInner.geometry = new THREE.SphereGeometry(markerRadius, 32, 16);
    }

    function updateMarkerPosition(deltaTime) {
      if (!markerGroup || trajectoryPoints.length < 2) return;

      const speed = Number(ui.markerSpeed.value);
      const maxIndex = trajectoryPoints.length - 1;

      markerIndexFloat += markerDirection * speed * deltaTime * trajectoryPoints.length / 20;

      if (markerIndexFloat >= maxIndex) {
        markerIndexFloat = maxIndex;
        markerDirection = -1;
      }

      if (markerIndexFloat <= 0) {
        markerIndexFloat = 0;
        markerDirection = 1;
      }

      const i0 = Math.floor(markerIndexFloat);
      const i1 = Math.min(i0 + 1, maxIndex);
      const f = markerIndexFloat - i0;

      const p0 = trajectoryPoints[i0];
      const p1 = trajectoryPoints[i1];

      markerGroup.position.copy(p0).lerp(p1, f);
    }

    function updateUIValues() {
      ui.sigmaValue.textContent = Number(ui.sigma.value).toFixed(1);
      ui.rhoValue.textContent = Number(ui.rho.value).toFixed(1);
      ui.betaValue.textContent = Number(ui.beta.value).toFixed(2);
      ui.dtValue.textContent = Number(ui.dt.value).toFixed(3);
      ui.stepsValue.textContent = ui.steps.value;
      ui.radiusValue.textContent = Number(ui.radius.value).toFixed(3);
      ui.radialValue.textContent = ui.radial.value;
      ui.markerSpeedValue.textContent = Number(ui.markerSpeed.value).toFixed(2);
      ui.markerSizeValue.textContent = Number(ui.markerSize.value).toFixed(3);
      ui.rotateValue.textContent = ui.rotateCheckbox.checked ? "Yes" : "No";
    }

    function exportSTL() {
      if (!attractorMesh) return;

      const exporter = new STLExporter();
      const binary = true;
      const stlData = exporter.parse(attractorMesh, { binary });

      const blob = new Blob([stlData], {
        type: "application/octet-stream"
      });

      const url = URL.createObjectURL(blob);

      const filename =
        "lorenz_attractor_clean_" +
        "sigma_" + Number(ui.sigma.value).toFixed(1) +
        "_rho_" + Number(ui.rho.value).toFixed(1) +
        "_beta_" + Number(ui.beta.value).toFixed(2) +
        ".stl";

      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      URL.revokeObjectURL(url);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      const deltaTime = clock.getDelta();

      controls.update();
      updateMarkerPosition(deltaTime);

      if (ui.rotateCheckbox.checked && attractorGroup) {
        attractorGroup.rotation.y += 0.001;
      }

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
